[system]
compatible=@MACHINE@
bootloader=@BOOTLOADER@
mountprefix=/mnt/rauc
data-directory=/mnt/config/rauc/

[handlers]
pre-install=/usr/lib/rauc/rauc-pre-install.sh
post-install=/usr/lib/rauc/rauc-post-install.sh

[keyring]
path=@RAUC_KEYRING_FILE@

[artifacts.artifacts]
path=/mnt/artifacts
type=trees

# 1. type=trees (Directory Overwrite):
#   If you are updating application folders or container root directories
#   via a tarball extraction (conversion=tar-extract), RAUC wipes the target
#   directory completely before extracting the new files. This guarantees
#   that no orphan files or residual code from an older build conflict
#   with the new application state.
# 2. type=file (Single Asset Replacement):
#   If the partition updates a single heavy file (like a .tflite or .onnx deep
#   learning model for the Pollux's NPU), RAUC deletes the old binary/model
#   file to atomic-swap in the new one.
# 3. The "Read-Only" Design Rule:
#   RAUC inherently presumes that anything placed in an artifact partition
#   is static code or asset data. It does not expect application runtime output to live there.

@IF_BOOTLOADER_SLOT@
# Bootloader
[slot.bootloader.0]
device=/dev/mmcblk@SD_DEV@
type=boot-raw-fallback
region-start=@SD_BOOT_REG_START@
region-size=@SD_BOOT_REG_SIZE@
@ENDIF_BOOTLOADER_SLOT@

# System A
[slot.rootfs.0]
device=@SD_ROOTFS_0_DEV@
type=ext4
bootname=system0
resize=true

[slot.boot.0]
device=/dev/mmcblk@SD_DEV@p1
# Keeping type=vfat ensures U-Boot and RAUC validate the filesystem type.
type=vfat
# type=raw
parent=rootfs.0

# System B
[slot.rootfs.1]
device=@SD_ROOTFS_1_DEV@
type=ext4
bootname=system1
resize=true

[slot.boot.1]
device=/dev/mmcblk@SD_DEV@p2
type=vfat
#type=raw
parent=rootfs.1
